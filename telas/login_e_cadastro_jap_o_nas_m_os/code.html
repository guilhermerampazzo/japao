<script>
        function switchTab(tab) {
            const tabEntrar = document.getElementById('tab-entrar');
            const tabCriar = document.getElementById('tab-criar');
            const formEntrar = document.getElementById('form-entrar');
            const formCriar = document.getElementById('form-criar');

            if (tab === 'entrar') {
                tabEntrar.classList.remove('tab-inactive');
                tabEntrar.classList.add('tab-active');
                tabCriar.classList.remove('tab-active');
                tabCriar.classList.add('tab-inactive');
                
                formEntrar.classList.remove('hidden');
                formEntrar.classList.add('block');
                formCriar.classList.add('hidden');
                formCriar.classList.remove('block');
            } else {
                tabCriar.classList.remove('tab-inactive');
                tabCriar.classList.add('tab-active');
                tabEntrar.classList.remove('tab-active');
                tabEntrar.classList.add('tab-inactive');

                formCriar.classList.remove('hidden');
                formCriar.classList.add('block');
                formEntrar.classList.add('hidden');
                formEntrar.classList.remove('block');
            }
        }

        // Simple form validation visual demo
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
